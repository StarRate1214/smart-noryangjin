name: Probe market site
on:
  push:
    branches: [claude/peaceful-newton-wcwt3x]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: probe
        run: |
          python - <<'EOF2'
          import re, time, io, noryangjin
          s = noryangjin.new_session(retries=2)
          page = s.get(noryangjin.PAGE_URL, timeout=30).text
          print("TOKEN in GET page:", re.findall(r"<input[^>]*excelToken[^>]*>", page))
          for species in ("", "방어"):
              form = {"pageIndex": 1, "pageUnit": 10, "pageSize": 10, "kdfshNm": species, "kdfshCode": species,
                      "searchStartDe": "2026.11.18", "searchEndDe": "2026.11.18"}
              lst = s.post(noryangjin.PAGE_URL, data=form, headers=noryangjin.POST_HEADERS, timeout=60).text
              tags = re.findall(r"<input[^>]*excelToken[^>]*>", lst)
              print("====", repr(species), "list len", len(lst), "token tags", tags)
              m = re.search(r'id="excelToken"[^>]*value="([^"]*)"', lst) or re.search(r'value="([^"]*)"[^>]*id="excelToken"', lst)
              tok = m.group(1) if m else ""
              i = lst.find("물량"); print("  summary:", re.sub(r"<[^>]+>|\s+", " ", lst[i:i+200]))
              time.sleep(2)
              r = s.post(noryangjin.EXCEL_URL, data={**form, "excelToken": tok}, headers=noryangjin.POST_HEADERS, timeout=60)
              print("  excel", r.status_code, r.headers.get("Content-Type"), r.headers.get("Content-Disposition"), len(r.content), r.content[:8])
              try:
                  t = noryangjin.parse_table(r.content); print("  rows", len(t), list(t.columns)[:9])
              except Exception as e:
                  print("  parse error", e)
              time.sleep(2)
              r = s.post(noryangjin.EXCEL_URL, data={**form, "excelToken": tok}, headers=noryangjin.POST_HEADERS, timeout=60)
              print("  reuse same token ->", len(r.content), r.content[:8])
              time.sleep(2)
          EOF2
