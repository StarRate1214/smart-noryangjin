name: Update market dashboard

on:
  schedule:
    # 매일 06:45 KST (= 21:45 UTC 전날). 정각에는 예약 실행이 몰려 GitHub 가 몇 시간씩 늦추므로 45분에 둔다.
    - cron: "45 21 * * *"
    # 10:45, 14:45, 18:45 KST 에는 원본이 빠진 날짜만 받는다. 아침 수집이 실패한 날을 채우는 용도라
    # 원본이 모두 있으면 사이트에 요청하지 않는다.
    - cron: "45 1,5,9 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "데이터 소스 (비우면 저장소 변수 DATA_SOURCE, 그것도 없으면 live)"
        type: choice
        options: ["", "live", "sample"]
        default: ""
      backfill_days:
        description: "원본(data/daily)이 없는 과거 며칠을 채울지"
        default: "7"
      backfill_from:
        description: "기간 백필 시작일 YYYY-MM-DD (지정하면 평소 수집 대신 이 기간의 빠진 날짜를 받음)"
        default: ""
      backfill_to:
        description: "기간 백필 종료일 YYYY-MM-DD (비우면 오늘)"
        default: ""
      backfill_limit:
        description: "기간 백필에서 한 번에 받을 최대 날짜 수"
        default: "60"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

# 2026-10-21 에는 일부 실행기 IP 만 연결 단계에서 막혔다. 같은 실행기에서 다시 시도해도 소용없으므로
# 실패하면 새 실행기에서 최대 두 번 더 돈다. 아침 수집과 수동 실행은 오늘·어제를 다시 받고(refresh_recent=1),
# 낮 재시도는 빠진 날짜만 받는다. 앞선 시도의 접속 실패는 job 을 실패시키지 않고 collected=false 로만 알리므로,
# 다음 시도는 그 값을 보고 돈다. 데이터 검사나 커밋이 실패하면 job 이 실패하고 재시도하지 않는다(IP 문제가 아니다).
jobs:
  attempt-1:
    uses: ./.github/workflows/collect.yml
    secrets: inherit
    with:
      attempt: 1
      source: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
      backfill_days: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '7' }}
      refresh_recent: ${{ github.event.schedule == '45 1,5,9 * * *' && '0' || '1' }}
      backfill_from: ${{ inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_limit: ${{ inputs.backfill_limit || '60' }}

  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.collected != 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit
    with:
      attempt: 2
      source: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
      backfill_days: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '7' }}
      refresh_recent: ${{ github.event.schedule == '45 1,5,9 * * *' && '0' || '1' }}
      backfill_from: ${{ inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_limit: ${{ inputs.backfill_limit || '60' }}

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.collected != 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit
    with:
      attempt: 3
      final: true
      source: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
      backfill_days: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '7' }}
      refresh_recent: ${{ github.event.schedule == '45 1,5,9 * * *' && '0' || '1' }}
      backfill_from: ${{ inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_limit: ${{ inputs.backfill_limit || '60' }}
