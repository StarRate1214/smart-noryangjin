name: Update market dashboard

on:
  schedule:
    # 매일 06:45 KST (= 21:45 UTC 전날). 정각에는 예약 실행이 몰려 GitHub 가 몇 시간씩 늦추므로 45분에 둔다.
    - cron: "45 21 * * *"
    # 07:45~10:45 KST 매시와 14:45, 18:45 KST 에는 원본이 없거나 경매 집계 전(06시 전)에 받은 날짜만 받는다.
    # GitHub 는 예약 실행을 몇 시간씩 늦추거나 건너뛰기도 해(2026-11-05 06:45 실행이 오지 않았고, 전날 18:45 실행이
    # 02:30 에 돌아 반쪽 원본을 받았다) 아침에 여러 번 둔다. 받을 것이 없으면 사이트에 요청하지 않는다.
    - cron: "45 22,23,0,1,5,9 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "데이터 소스 (비우면 저장소 변수 DATA_SOURCE, 그것도 없으면 live)"
        type: choice
        options: ["", "live", "sample"]
        default: ""
      backfill_days:
        description: "원본(data/daily)이 없는 과거 며칠을 채울지"
        default: "7"
      backfill_from:
        description: "기간 백필 시작일 YYYY-MM-DD (지정하면 평소 수집 대신 이 기간의 빠진 날짜를 받음)"
        default: ""
      backfill_to:
        description: "기간 백필 종료일 YYYY-MM-DD (비우면 오늘)"
        default: ""
      backfill_limit:
        description: "기간 백필에서 한 번에 받을 최대 날짜 수"
        default: "60"

permissions:
  contents: write

# 2026-10-21 에는 일부 실행기 IP 만 연결 단계에서 막혔다. 같은 실행기에서 다시 시도해도 소용없으므로
# 실패하면 새 실행기에서 최대 두 번 더 돈다. 아침 수집과 수동 실행은 오늘·어제를 다시 받고(refresh_recent=1),
# 낮 재시도는 빠졌거나 경매 집계 전에 받은 날짜만 받는다. 앞선 시도의 접속 실패는 job 을 실패시키지 않고 collected=false 로만 알리므로,
# 다음 시도는 그 값을 보고 돈다. 데이터 검사나 커밋이 실패하면 job 이 실패하고 재시도하지 않는다(IP 문제가 아니다).
jobs:
  # 2026-10-30 무렵부터 GitHub 가 이 저장소의 예약 실행을 cron 개수와 상관없이 하루 3번(대략 02시, 10시, 17시 KST)만
  # 돌린다. 06:45 예약은 사실상 오지 않고, 02시 실행은 경매 집계 전이라 반쪽 원본을 받는다. 그래서 06:20 KST 전에
  # 시작한 예약 실행은 06:20 까지 기다렸다가 수집한다(최대 5시간 50분, 공개 저장소라 실행 시간 비용이 없다).
  # 수집 job 의 동시 실행 제한은 collect.yml 에 있어, 기다리는 동안 수동 실행을 막지 않는다.
  wait-for-auction:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait until 06:20 KST
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "예약 실행이 아니라 기다리지 않습니다"; exit 0; fi
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d "today 06:20" +%s)
          wait=$(( target - now ))
          if [ "$wait" -gt 0 ] && [ "$wait" -le 21000 ]; then
            echo "경매 집계가 끝나는 06:20 KST 까지 ${wait}초 기다립니다"
            sleep "$wait"
          else
            echo "06:20 KST 가 지났거나 너무 멀어 바로 수집합니다"
          fi

  attempt-1:
    needs: wait-for-auction
    uses: ./.github/workflows/collect.yml
    secrets: inherit
    with:
      attempt: 1
      source: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
      backfill_days: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '7' }}
      refresh_recent: ${{ github.event.schedule == '45 22,23,0,1,5,9 * * *' && '0' || '1' }}
      backfill_from: ${{ inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_limit: ${{ inputs.backfill_limit || '60' }}

  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.collected != 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit
    with:
      attempt: 2
      source: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
      backfill_days: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '7' }}
      refresh_recent: ${{ github.event.schedule == '45 22,23,0,1,5,9 * * *' && '0' || '1' }}
      backfill_from: ${{ inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_limit: ${{ inputs.backfill_limit || '60' }}

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.collected != 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit
    with:
      attempt: 3
      final: true
      source: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
      backfill_days: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '7' }}
      refresh_recent: ${{ github.event.schedule == '45 22,23,0,1,5,9 * * *' && '0' || '1' }}
      backfill_from: ${{ inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_limit: ${{ inputs.backfill_limit || '60' }}
