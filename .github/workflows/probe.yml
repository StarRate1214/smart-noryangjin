name: Probe market site
on:
  push:
    branches: [claude/peaceful-newton-wcwt3x]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Range and history
        run: |
          python - <<'EOF2'
          import datetime, time, noryangjin
          s = noryangjin.new_session(retries=2)
          def get(a, b):
              f = {"pageIndex": 1, "pageUnit": 10, "pageSize": 10, "kdfshNm": "", "kdfshCode": "",
                   "searchStartDe": a, "searchEndDe": b}
              r = s.post(noryangjin.EXCEL_URL, data=f, headers=noryangjin.POST_HEADERS, timeout=120)
              t = noryangjin.parse_table(r.content)
              print(a, b, r.status_code, len(r.content), "rows", len(t), "cols", list(t.columns))
              return t
          for a, b in [("2025.11.03", "2025.11.03"), ("2025.11.03", "2025.11.04"), ("2025.11.01", "2025.11.30"),
                       ("2025.08.04", "2025.08.04"), ("2024.11.04", "2024.11.04")]:
              t = get(a, b); time.sleep(2)
              if len(t): print(t.head(3).to_string())
          EOF2
