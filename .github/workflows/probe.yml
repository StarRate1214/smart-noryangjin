name: Probe market site
on:
  push:
    branches: [claude/peaceful-newton-wcwt3x]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt -r requirements-test.txt
      - name: probe
        run: |
          ip=$(curl -sS -m 10 https://ipinfo.io/json | python -c "import json,sys;d=json.load(sys.stdin);print(d['ip'],d.get('region'),d.get('org'))")
          if timeout 10 bash -c '</dev/tcp/www.susansijang.co.kr/443' 2>/dev/null; then tcp=open; else tcp=BLOCKED; fi
          rm -f data/daily/2026-10-2*.csv
          if [ $tcp = open ]; then REFRESH_RECENT=0 BACKFILL_DAYS=4 python pipeline.py >out.txt 2>&1 && res=ok || res=fail; tail -3 out.txt; else res=skip; fi
          echo "::notice::RESULT $ip | tcp=$tcp | pipeline=$res"
