name: Update market dashboard

on:
  schedule:
    # 매일 07:00 KST (= 22:00 UTC 전날)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect prices and build index.html
        env:
          # 저장소 Settings > Secrets and variables > Actions > Variables 에서 DATA_SOURCE=live 로 전환
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'sample' }}
        run: python pipeline.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv index.html
          git diff --cached --quiet || git commit -m "chore: update market data $(TZ=Asia/Seoul date +%F)"
          git push
