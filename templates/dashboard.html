<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트 노량진</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #fafafa; --panel: #fff; --line: #e5e5e5; --text: #1d1d1f; --muted: #666;
    --accent: #1f7a45; --accent-soft: #e6f4ec; --star: #f5a623;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: Pretendard, "Noto Sans KR", -apple-system, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .notice { background: #fff4d6; border: 1px solid #f0d78c; border-radius: 8px;
            padding: 10px 14px; font-size: .9rem; margin-bottom: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px 14px; margin-bottom: 12px; }
  .group { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
  .group + .group { border-top: 1px dashed var(--line); }
  .group-label { flex: 0 0 44px; font-size: .82rem; color: var(--muted); padding-top: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
          background: #fff; color: var(--text); border-radius: 999px; padding: 5px 12px;
          font: inherit; font-size: .88rem; cursor: pointer; }
  .chip:hover { border-color: #bbb; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent);
                               color: var(--accent); font-weight: 600; }
  .chip .count { color: var(--muted); font-size: .75rem; font-weight: 400; }
  .chip.species { padding-left: 6px; }
  .star { border: 0; background: none; padding: 0 2px; font-size: 1rem; line-height: 1;
          color: #c8c8c8; cursor: pointer; }
  .star.on { color: var(--star); }
  .hint { font-size: .78rem; color: var(--muted); margin: 4px 0 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
           gap: 12px; margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: .82rem; }
  .card .value { font-size: 1.35rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .detail { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 8px; min-height: 420px; }
  #plot { width: 100%; height: 420px; }
  .empty { padding: 60px 16px; text-align: center; color: var(--muted); }
  footer { color: #888; font-size: .8rem; margin-top: 16px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="title">노량진 경락시세</h1>
  <p class="sub" id="subtitle"></p>
  <div class="notice" id="notice" hidden>현재 표시된 값은 화면 확인용 <b>샘플 데이터</b>입니다. 실제 시세가 아닙니다.</div>

  <section class="panel" aria-label="필터">
    <div class="group"><span class="group-label">어종</span><div class="chips" id="species"></div></div>
    <div class="group"><span class="group-label">상태</span><div class="chips" id="states"></div></div>
    <div class="group"><span class="group-label">산지</span><div class="chips" id="origins"></div></div>
    <div class="group"><span class="group-label">규격</span><div class="chips" id="sizes"></div></div>
    <p class="hint">★를 누르면 즐겨찾는 어종이 맨 앞에 옵니다(이 브라우저에만 저장). 산지·규격은 여러 개를 고를 수 있고, 숫자는 최근 거래 건수입니다. kg 단위 거래만 셉니다.</p>
  </section>

  <div class="cards">
    <div class="card"><div class="label" id="lastLabel">최근 경매 최고가</div><div class="value" id="lastHigh">-</div><div class="detail" id="lastDetail"></div></div>
    <div class="card"><div class="label">가성비 매수 구간</div><div class="value" id="zone">-</div><div class="detail" id="zoneDetail"></div></div>
    <div class="card"><div class="label" id="avgLabel">최고가 평균</div><div class="value" id="avgHigh">-</div><div class="detail" id="avgDetail"></div></div>
  </div>
  <div class="chart"><div id="plot"></div><div class="empty" id="empty" hidden>조건에 맞는 거래가 없습니다. 필터를 바꿔 보세요.</div></div>
  <footer id="footer"></footer>
</main>

<script>
const DATA = /*__DATA__*/null;
const ROWS = DATA.rows.map((r) => Object.fromEntries(DATA.fields.map((f, i) => [f, r[i]])))
  .filter((r) => (r.pack || "").toLowerCase() === "kg" && r.high > 0);
const STATES = [["활", "활어"], ["선", "선어"], ["", "전체"]];

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 불가 환경 */ }
}
const won = (v) => Math.round(v).toLocaleString("ko-KR") + "원";

const available = DATA.species.filter((s) => ROWS.some((r) => r.species === s));
let favorites = load("nr.favorites", []).filter((s) => available.includes(s));
const firstPick = favorites[0] || available[0];
const saved = load("nr.species", firstPick);
const view = {
  species: available.includes(saved) ? saved : firstPick,
  state: load("nr.state", "활"),
  origins: new Set(),
  sizes: new Set(),
};

function speciesRows() {
  return ROWS.filter((r) => r.species === view.species && (!view.state || r.state === view.state));
}

function countBy(rows, key) {
  const m = new Map();
  rows.forEach((r) => { if (r[key]) m.set(r[key], (m.get(r[key]) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"));
}

function chip(label, pressed, onClick, count) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.textContent = label;
  if (count !== undefined) {
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = count;
    b.append(c);
  }
  b.addEventListener("click", onClick);
  return b;
}

function renderSpecies() {
  const box = document.getElementById("species");
  box.replaceChildren();
  const ordered = [...favorites, ...available.filter((s) => !favorites.includes(s))];
  ordered.forEach((s) => {
    const isFav = favorites.includes(s);
    const b = chip(s, s === view.species, () => {
      view.species = s; view.origins.clear(); view.sizes.clear();
      save("nr.species", s); update();
    });
    b.classList.add("species");
    const star = document.createElement("span");
    star.className = "star" + (isFav ? " on" : "");
    star.textContent = isFav ? "★" : "☆";
    star.setAttribute("role", "button");
    star.setAttribute("aria-label", s + (isFav ? " 즐겨찾기 해제" : " 즐겨찾기"));
    star.addEventListener("click", (e) => {
      e.stopPropagation();
      favorites = isFav ? favorites.filter((x) => x !== s) : [...favorites, s];
      save("nr.favorites", favorites); renderSpecies();
    });
    b.prepend(star);
    box.append(b);
  });
}

function renderMulti(boxId, options, selected) {
  const box = document.getElementById(boxId);
  box.replaceChildren();
  // 더 이상 없는 값은 선택에서 뺀다
  [...selected].forEach((v) => { if (!options.some(([o]) => o === v)) selected.delete(v); });
  box.append(chip("전체", selected.size === 0, () => { selected.clear(); update(); }));
  options.forEach(([value, count]) => {
    box.append(chip(value, selected.has(value), () => {
      selected.has(value) ? selected.delete(value) : selected.add(value); update();
    }, count));
  });
}

function renderFilters() {
  const states = document.getElementById("states");
  states.replaceChildren();
  STATES.forEach(([value, label]) => {
    const n = ROWS.filter((r) => r.species === view.species && (!value || r.state === value)).length;
    states.append(chip(label, view.state === value, () => {
      view.state = value; save("nr.state", value); update();
    }, n));
  });
  const base = speciesRows();
  renderMulti("origins", countBy(base, "origin"), view.origins);
  const byOrigin = base.filter((r) => !view.origins.size || view.origins.has(r.origin));
  renderMulti("sizes", countBy(byOrigin, "size"), view.sizes);
}

function dailyHighs() {
  const best = new Map();
  speciesRows()
    .filter((r) => (!view.origins.size || view.origins.has(r.origin)) && (!view.sizes.size || view.sizes.has(r.size)))
    .forEach((r) => { const cur = best.get(r.date); if (!cur || r.high > cur.high) best.set(r.date, r); });
  return [...best.values()].sort((a, b) => a.date.localeCompare(b.date));
}

function renderChart(days) {
  const plot = document.getElementById("plot");
  const empty = document.getElementById("empty");
  plot.hidden = !days.length;
  empty.hidden = !!days.length;
  if (!days.length) { Plotly.purge(plot); return; }
  const x = days.map((d) => d.date);
  const high = days.map((d) => d.high);
  const hover = "%{y:,.0f}원<extra></extra>";
  Plotly.react(plot, [
    { x, y: high, name: "당일 경매 최고가 (100%)", mode: "lines+markers",
      line: { color: "#e0443e", width: 2.5 },
      customdata: days.map((d) => [d.origin, d.size, d.qty]),
      hovertemplate: "%{y:,.0f}원 (%{customdata[0]} %{customdata[1]})<extra></extra>" },
    { x, y: high.map((v) => Math.round(v * DATA.upper)), name: `가성비 상한선 (${DATA.upper * 100}%)`,
      mode: "lines", line: { color: "#2e9e5b", width: 1.5, dash: "dash" }, hovertemplate: hover },
    { x, y: high.map((v) => Math.round(v * DATA.lower)), name: `가성비 하한선 (${DATA.lower * 100}%)`,
      mode: "lines", line: { color: "#1f7a45", width: 1.5, dash: "dash" },
      fill: "tonexty", fillcolor: "rgba(46, 158, 91, 0.15)", hovertemplate: hover },
  ], {
    hovermode: "x unified", paper_bgcolor: "#fff", plot_bgcolor: "#fff",
    margin: { l: 60, r: 16, t: 36, b: 44 },
    legend: { orientation: "h", traceorder: "normal", yanchor: "bottom", y: 1.02, xanchor: "center", x: 0.5 },
    xaxis: { tickformat: "%m/%d", hoverformat: "%Y-%m-%d", type: "date", gridcolor: "#eee" },
    yaxis: { tickformat: ",.0f", title: { text: "단가 (원 / kg)" }, gridcolor: "#eee" },
    font: { family: "Pretendard, 'Noto Sans KR', sans-serif" },
  }, { displayModeBar: false, responsive: true });
}

function renderCards(days) {
  const set = (id, text) => { document.getElementById(id).textContent = text; };
  if (!days.length) {
    ["lastHigh", "zone", "avgHigh"].forEach((id) => set(id, "-"));
    ["lastDetail", "zoneDetail", "avgDetail"].forEach((id) => set(id, ""));
    return;
  }
  const last = days[days.length - 1];
  set("lastLabel", `최근 경매 최고가 (${last.date.slice(5).replace("-", "/")})`);
  set("lastHigh", won(last.high));
  set("lastDetail", [last.origin, last.size].filter(Boolean).join(" · "));
  set("zone", `${won(last.high * DATA.lower).replace("원", "")}~${won(last.high * DATA.upper)}`);
  set("zoneDetail", `최고가의 ${DATA.lower * 100}~${DATA.upper * 100}%`);
  set("avgLabel", `최고가 평균 (${days.length}일)`);
  set("avgHigh", won(days.reduce((s, d) => s + d.high, 0) / days.length));
  set("avgDetail", `최저 ${won(Math.min(...days.map((d) => d.high)))} · 최고 ${won(Math.max(...days.map((d) => d.high)))}`);
}

function update() {
  renderSpecies();
  renderFilters();
  const days = dailyHighs();
  const stateLabel = STATES.find(([v]) => v === view.state)[1];
  document.getElementById("title").textContent = `노량진 ${view.species} 최근 ${DATA.window}일 시세`;
  document.getElementById("subtitle").textContent =
    `${stateLabel} · 날짜별 경매 최고가와 고가 대비 ${DATA.lower * 100}~${DATA.upper * 100}% 가성비 매수 구간`;
  renderCards(days);
  renderChart(days);
}

document.getElementById("notice").hidden = !DATA.sample;
document.getElementById("footer").innerHTML =
  `마지막 갱신: ${DATA.updated} (KST) · 단가는 1kg 기준 · 출처: ` +
  (DATA.sample ? "샘플 데이터"
    : '<a href="https://www.susansijang.co.kr/nsis/miw/ko/info/miw3130">노량진수산물도매시장 어종별 경락시세</a>');
if (available.length) update();
else document.getElementById("empty").hidden = false;
</script>
</body>
</html>
