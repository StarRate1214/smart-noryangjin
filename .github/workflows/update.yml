name: Update market dashboard

on:
  schedule:
    # 매일 07:00 KST (= 22:00 UTC 전날)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "데이터 소스 (비우면 저장소 변수 DATA_SOURCE, 그것도 없으면 live)"
        type: choice
        options: ["", "live", "sample"]
        default: ""
      backfill_days:
        description: "원본(data/raw)이 없는 과거 며칠을 채울지"
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt -r requirements-test.txt

      - name: Collect prices and build index.html
        env:
          # 저장소 Settings > Secrets and variables > Actions > Variables 에서 지정
          DATA_SOURCE: ${{ inputs.source || vars.DATA_SOURCE || 'live' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || vars.BACKFILL_DAYS || '0' }}
          SPECIES: ${{ vars.SPECIES }}
        run: python pipeline.py

      # 커밋 전에 원본과 새 페이지를 검사한다. 봇 커밋은 GITHUB_TOKEN 으로 올라가 CI 를 실행시키지 않기 때문이다.
      - name: Check data and page
        run: pytest tests/test_data.py -q

      - name: Upload unparsed response
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-response
          path: debug/
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet || git commit -m "chore: update market data $(TZ=Asia/Seoul date +%F)"
          git push
