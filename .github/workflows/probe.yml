name: Probe market site

# 공식 홈페이지 접속 실패 원인을 가리기 위한 일회성 진단.
on:
  push:
    branches: [claude/peaceful-newton-wcwt3x]
    paths: [.github/workflows/probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: Runner IP
        run: curl -sS -m 10 https://ipinfo.io/ip; echo

      - name: Page form
        if: matrix.n == 1
        run: |
          curl -sS -m 25 -A "Mozilla/5.0" https://www.susansijang.co.kr/nsis/miw/ko/info/miw3130 -o page.html
          wc -c page.html
          grep -n -i -E '<form|<input|excel|csrf|token|captcha|fn_|\.do|action=' page.html | sed 's/^\s*//' | cut -c1-220 | head -80
          grep -o -E 'src="[^"]+\.js[^"]*"' page.html | head -30

      - name: Fetch 10/20 and 10/21 with current code
        run: |
          python - <<'EOF'
          import datetime, noryangjin
          s = noryangjin.new_session(retries=1)
          print("cookies", s.cookies.get_dict())
          for d in (datetime.date(2026, 10, 20), datetime.date(2026, 10, 21)):
              raw = noryangjin.download(s, "", d)
              print(d, len(raw), raw[:8])
              try:
                  t = noryangjin.parse_table(raw)
                  print("  rows", len(t))
              except Exception as e:
                  print("  parse error", e, raw[:300])
          EOF
