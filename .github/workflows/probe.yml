name: Probe market site
on:
  push:
    branches: [claude/peaceful-newton-wcwt3x]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt -r requirements-test.txt
      - run: rm -f data/daily/2026-10-2*.csv && python pipeline.py && wc -l data/daily/2026-10-2*.csv && pytest tests/test_data.py -q
        env:
          REFRESH_RECENT: "0"
          BACKFILL_DAYS: "4"
