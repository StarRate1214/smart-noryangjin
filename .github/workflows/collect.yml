name: Collect market data

# update.yml 이 부르는 수집 한 번. 부를 때마다 새 실행기(대개 새 IP)에서 돈다.
on:
  workflow_call:
    inputs:
      attempt:
        type: number
        default: 1
      source:
        type: string
        default: live
      backfill_days:
        type: string
        default: "7"
      refresh_recent:
        type: string
        default: "1"
      # 지정하면 평소 수집 대신 이 기간(YYYY-MM-DD)의 빠진 날짜를 오래된 날부터 backfill_limit 개 받는다
      backfill_from:
        type: string
        default: ""
      backfill_to:
        type: string
        default: ""
      backfill_limit:
        type: string
        default: "60"
      # 마지막 시도만 접속 실패를 실패로 끝낸다. 앞선 시도의 접속 실패는 다음 시도가 새 IP 로 다시 해 보므로,
      # 실행 전체가 빨간색으로 끝나 알림 메일이 가지 않도록 경고만 남긴다.
      final:
        type: boolean
        default: false
    outputs:
      collected:
        description: "수집 단계가 성공했으면 true"
        value: ${{ jobs.collect.outputs.collected }}

permissions:
  contents: write

jobs:
  collect:
    # 국내 PC 를 self-hosted runner 로 붙였다면 저장소 변수 UPDATE_RUNNER 에 그 라벨을 넣는다.
    runs-on: ${{ vars.UPDATE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # 수집과 커밋은 한 번에 하나씩 돈다(예약 실행, 수동 실행, 재시도가 겹쳐도 push 가 엉키지 않게)
    concurrency:
      group: update-dashboard
      cancel-in-progress: false
    outputs:
      collected: ${{ steps.collect.outcome == 'success' }}
    steps:
      # 앞선 시도가 막혔을 때 곧바로 다시 붙지 않도록 잠시 쉰다.
      - name: Wait before retry
        if: inputs.attempt > 1
        run: sleep $(( ${{ inputs.attempt }} * 90 ))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt -r requirements-test.txt

      - name: Runner IP
        run: echo "시도 ${{ inputs.attempt }}, 실행기 IP $(curl -sS -m 10 https://ipinfo.io/ip || echo 알 수 없음)"

      - name: Collect prices and build index.html
        id: collect
        continue-on-error: true
        env:
          DATA_SOURCE: ${{ inputs.source }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          REFRESH_RECENT: ${{ inputs.refresh_recent }}
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          BACKFILL_TO: ${{ inputs.backfill_to }}
          BACKFILL_LIMIT: ${{ inputs.backfill_limit }}
        run: python pipeline.py

      # 커밋 전에 원본과 새 페이지를 검사한다. 봇 커밋은 GITHUB_TOKEN 으로 올라가 CI 를 실행시키지 않기 때문이다.
      - name: Check data and page
        if: steps.collect.outcome == 'success'
        run: pytest tests/test_data.py -q

      # 최근 거래일에 걸린 새 알림을 ntfy 로 보낸다. 보낸 기록(data/alerts_sent.json)은 아래에서 함께 커밋한다.
      # 알림이 실패해도 수집한 데이터는 커밋하도록 이 단계의 실패는 넘어간다. 기간 백필에서는 보내지 않는다.
      - name: Send alerts
        if: steps.collect.outcome == 'success' && inputs.backfill_from == ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python alerts.py --send

      # 실패 원인을 가린다. 연결 자체가 안 되면 이 IP 가 막힌 것이고, 연결은 되는데 실패하면 요청이나 응답 문제다.
      - name: Diagnose connection
        if: steps.collect.outcome == 'failure'
        run: |
          if timeout 15 bash -c '</dev/tcp/www.susansijang.co.kr/443' 2>/dev/null; then
            echo "::warning::443 연결은 됩니다. 요청 형식이나 응답 해석을 살펴보세요."
          else
            echo "::warning::443 연결이 되지 않습니다. 이 실행기 IP 가 사이트 방화벽에 막혔을 수 있습니다."
          fi

      - name: Upload unparsed response
        if: steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: debug-response-${{ inputs.attempt }}
          path: debug/
          if-no-files-found: ignore

      - name: Commit changes
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git diff --cached --quiet || git commit -m "chore: update market data $(TZ=Asia/Seoul date +%F)"
          # GitHub 가 push 를 일시적으로 거부하는 일이 있어(2026-11-04 Internal Server Error) 받은 데이터를 버리지 않도록
          # 다시 시도한다. 그 사이 main 이 앞서 나갔으면 그 위로 올린다.
          for i in 1 2 3; do
            git push && exit 0
            sleep $(( i * 15 ))
            git pull --rebase origin main || true
          done
          exit 1

      - name: Fail on the last attempt
        if: steps.collect.outcome == 'failure' && inputs.final
        run: |
          echo "::error::세 번 모두 수집하지 못했습니다. 위 진단 경고를 확인하세요."
          exit 1
